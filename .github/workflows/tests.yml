# SPDX-License-Identifier: MPL-2.0
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/*.cjs
      - name: Build standalone browser export
        run: python scripts/export_web.py --output dist/web
      - name: Verify installed package outside the checkout
        working-directory: /tmp
        run: |
          python -c "from virtual_synth.server import STATIC, ASSETS; assert all((STATIC / name).is_file() for name, _ in ASSETS.values())"
          ossm-motion-synth --help
